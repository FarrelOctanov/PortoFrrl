  <!-- Main Content Area -->
  <g id="main-content" transform="translate(196, 56)">
    <!-- Section Title & Live Timestamp -->
    <text x="0" y="16" fill="#f8fafc" font-size="14" font-family="'Quicksand', sans-serif" font-weight="700">Ringkasan Operasional OWALLA.ID</text>
    <text x="420" y="16" fill="#64748b" font-size="9.5" font-family="'Quicksand', sans-serif" text-anchor="end">Update Realtime • MySQL Database</text>

    <!-- Top KPI Stat Cards (3 Cards) -->
    <!-- Stat 1: Total Penjualan -->
    <g transform="translate(0, 30)">
      <rect width="186" height="70" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="20" fill="#94a3b8" font-size="9.5" font-family="'Quicksand', sans-serif" font-weight="600">Penjualan Hari Ini</text>
      <text x="14" y="44" fill="#38bdf8" font-size="17" font-family="'Quicksand', sans-serif" font-weight="800">Rp 3.420.000</text>
      <g transform="translate(14, 52)">
        <text x="0" y="10" fill="#10b981" font-size="9" font-family="'Quicksand', sans-serif" font-weight="700">↑ +14.2%</text>
        <text x="46" y="10" fill="#64748b" font-size="8.5" font-family="'Quicksand', sans-serif">vs kemarin</text>
      </g>
    </g>

    <!-- Stat 2: Total SKU Produk -->
    <g transform="translate(198, 30)">
      <rect width="186" height="70" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="20" fill="#94a3b8" font-size="9.5" font-family="'Quicksand', sans-serif" font-weight="600">Katalog Stok Barang</text>
      <text x="14" y="44" fill="#f8fafc" font-size="17" font-family="'Quicksand', sans-serif" font-weight="800">1.248 SKU</text>
      <g transform="translate(14, 52)">
        <text x="0" y="10" fill="#38bdf8" font-size="9" font-family="'Quicksand', sans-serif" font-weight="700">● 4 Kategori</text>
        <text x="64" y="10" fill="#64748b" font-size="8.5" font-family="'Quicksand', sans-serif">Tersedia Aktif</text>
      </g>
    </g>

    <!-- Stat 3: Peringatan Stok Kritis -->
    <g transform="translate(396, 30)">
      <rect width="188" height="70" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="20" fill="#94a3b8" font-size="9.5" font-family="'Quicksand', sans-serif" font-weight="600">Peringatan Restock</text>
      <text x="14" y="44" fill="#f59e0b" font-size="17" font-family="'Quicksand', sans-serif" font-weight="800">12 Produk</text>
      <g transform="translate(14, 52)">
