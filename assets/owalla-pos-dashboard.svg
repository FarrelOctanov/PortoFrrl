        <text x="8" y="15" fill="#64748b" font-size="8.5" font-family="'Quicksand', sans-serif" font-weight="700">KODE</text>
        <text x="62" y="15" fill="#64748b" font-size="8.5" font-family="'Quicksand', sans-serif" font-weight="700">NAMA PRODUK</text>
        <text x="180" y="15" fill="#64748b" font-size="8.5" font-family="'Quicksand', sans-serif" font-weight="700">STOK</text>
        <text x="235" y="15" fill="#64748b" font-size="8.5" font-family="'Quicksand', sans-serif" font-weight="700">HARGA</text>
        <text x="295" y="15" fill="#64748b" font-size="8.5" font-family="'Quicksand', sans-serif" font-weight="700">STATUS</text>
      </g>

      <!-- Table Rows -->
      <!-- Row 1 -->
      <g transform="translate(14, 62)">
        <text x="8" y="18" fill="#38bdf8" font-size="9" font-family="'Quicksand', sans-serif" font-weight="700">OW-01</text>
        <text x="62" y="18" fill="#f8fafc" font-size="9.5" font-family="'Quicksand', sans-serif" font-weight="600">Kain Drill Premium</text>
        <text x="180" y="18" fill="#cbd5e1" font-size="9.5" font-family="'Quicksand', sans-serif">142 m</text>
        <text x="235" y="18" fill="#cbd5e1" font-size="9.5" font-family="'Quicksand', sans-serif">45.000</text>
        <rect x="290" y="6" width="38" height="15" rx="3" fill="#10b981" fill-opacity="0.15" />
        <text x="296" y="17" fill="#10b981" font-size="8" font-family="'Quicksand', sans-serif" font-weight="700">Aman</text>
        <line x1="0" y1="28" x2="336" y2="28" stroke="#1e293b" stroke-width="0.8" />
      </g>

      <!-- Row 2 -->
      <g transform="translate(14, 96)">
        <text x="8" y="18" fill="#38bdf8" font-size="9" font-family="'Quicksand', sans-serif" font-weight="700">OW-02</text>
        <text x="62" y="18" fill="#f8fafc" font-size="9.5" font-family="'Quicksand', sans-serif" font-weight="600">Benang Bordir Royal</text>
        <text x="180" y="18" fill="#cbd5e1" font-size="9.5" font-family="'Quicksand', sans-serif">28 roll</text>
        <text x="235" y="18" fill="#cbd5e1" font-size="9.5" font-family="'Quicksand', sans-serif">18.500</text>
        <rect x="290" y="6" width="38" height="15" rx="3" fill="#10b981" fill-opacity="0.15" />
        <text x="296" y="17" fill="#10b981" font-size="8" font-family="'Quicksand', sans-serif" font-weight="700">Aman</text>
        <line x1="0" y1="28" x2="336" y2="28" stroke="#1e293b" stroke-width="0.8" />
      </g>

      <!-- Row 3 -->
      <g transform="translate(14, 130)">
        <text x="8" y="18" fill="#38bdf8" font-size="9" font-family="'Quicksand', sans-serif" font-weight="700">OW-03</text>
        <text x="62" y="18" fill="#f8fafc" font-size="9.5" font-family="'Quicksand', sans-serif" font-weight="600">Kancing Kemeja Std</text>
        <text x="180" y="18" fill="#f59e0b" font-size="9.5" font-family="'Quicksand', sans-serif" font-weight="700">8 gross</text>
        <text x="235" y="18" fill="#cbd5e1" font-size="9.5" font-family="'Quicksand', sans-serif">24.000</text>
        <rect x="290" y="6" width="38" height="15" rx="3" fill="#f59e0b" fill-opacity="0.15" />
        <text x="294" y="17" fill="#f59e0b" font-size="7.5" font-family="'Quicksand', sans-serif" font-weight="700">Kritis</text>
        <line x1="0" y1="28" x2="336" y2="28" stroke="#1e293b" stroke-width="0.8" />
      </g>

      <!-- Row 4 -->
      <g transform="translate(14, 164)">
        <text x="8" y="18" fill="#38bdf8" font-size="9" font-family="'Quicksand', sans-serif" font-weight="700">OW-04</text>
        <text x="62" y="18" fill="#f8fafc" font-size="9.5" font-family="'Quicksand', sans-serif" font-weight="600">Zipper Metal 50cm</text>
        <text x="180" y="18" fill="#cbd5e1" font-size="9.5" font-family="'Quicksand', sans-serif">65 pcs</text>
        <text x="235" y="18" fill="#cbd5e1" font-size="9.5" font-family="'Quicksand', sans-serif">12.000</text>
        <rect x="290" y="6" width="38" height="15" rx="3" fill="#10b981" fill-opacity="0.15" />
        <text x="296" y="17" fill="#10b981" font-size="8" font-family="'Quicksand', sans-serif" font-weight="700">Aman</text>
        <line x1="0" y1="28" x2="336" y2="28" stroke="#1e293b" stroke-width="0.8" />
      </g>

      <!-- Row 5 -->
      <g transform="translate(14, 198)">
        <text x="8" y="18" fill="#38bdf8" font-size="9" font-family="'Quicksand', sans-serif" font-weight="700">OW-05</text>
        <text x="62" y="18" fill="#f8fafc" font-size="9.5" font-family="'Quicksand', sans-serif" font-weight="600">Pita Satin Bordir</text>
        <text x="180" y="18" fill="#cbd5e1" font-size="9.5" font-family="'Quicksand', sans-serif">94 roll</text>
        <text x="235" y="18" fill="#cbd5e1" font-size="9.5" font-family="'Quicksand', sans-serif">9.500</text>
        <rect x="290" y="6" width="38" height="15" rx="3" fill="#10b981" fill-opacity="0.15" />
        <text x="296" y="17" fill="#10b981" font-size="8" font-family="'Quicksand', sans-serif" font-weight="700">Aman</text>
      </g>
    </g>

    <!-- Right: Recent POS Cashier Feed (Live Feed) -->
    <g transform="translate(376, 114)">
      <rect width="208" height="262" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="22" fill="#f8fafc" font-size="11.5" font-family="'Quicksand', sans-serif" font-weight="700">Transaksi Kasir (POS)</text>

      <!-- POS Feed Item 1 -->
      <g transform="translate(12, 38)">
        <rect width="184" height="46" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
        <text x="10" y="18" fill="#f8fafc" font-size="10" font-family="'Quicksand', sans-serif" font-weight="700">INV-2025/0084</text>
        <text x="10" y="32" fill="#64748b" font-size="8.5" font-family="'Quicksand', sans-serif">14:28 • Kasir #01</text>
        <text x="174" y="19" fill="#38bdf8" font-size="10.5" font-family="'Quicksand', sans-serif" font-weight="800" text-anchor="end">Rp 350.000</text>
        <text x="174" y="32" fill="#10b981" font-size="8" font-family="'Quicksand', sans-serif" font-weight="700" text-anchor="end">QRIS Sukses</text>
      </g>

      <!-- POS Feed Item 2 -->
      <g transform="translate(12, 92)">
        <rect width="184" height="46" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
        <text x="10" y="18" fill="#f8fafc" font-size="10" font-family="'Quicksand', sans-serif" font-weight="700">INV-2025/0083</text>
        <text x="10" y="32" fill="#64748b" font-size="8.5" font-family="'Quicksand', sans-serif">13:52 • Kasir #01</text>
        <text x="174" y="19" fill="#38bdf8" font-size="10.5" font-family="'Quicksand', sans-serif" font-weight="800" text-anchor="end">Rp 1.120.000</text>
        <text x="174" y="32" fill="#10b981" font-size="8" font-family="'Quicksand', sans-serif" font-weight="700" text-anchor="end">Transfer Bank</text>
      </g>

      <!-- POS Feed Item 3 -->
      <g transform="translate(12, 146)">
        <rect width="184" height="46" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
        <text x="10" y="18" fill="#f8fafc" font-size="10" font-family="'Quicksand', sans-serif" font-weight="700">INV-2025/0082</text>
        <text x="10" y="32" fill="#64748b" font-size="8.5" font-family="'Quicksand', sans-serif">13:10 • Kasir #02</text>
        <text x="174" y="19" fill="#38bdf8" font-size="10.5" font-family="'Quicksand', sans-serif" font-weight="800" text-anchor="end">Rp 85.000</text>
        <text x="174" y="32" fill="#10b981" font-size="8" font-family="'Quicksand', sans-serif" font-weight="700" text-anchor="end">Tunai Pas</text>
      </g>

      <!-- POS Quick Action Button -->
      <g transform="translate(12, 204)">
        <rect width="184" height="30" rx="6" fill="#0284c7" />
        <text x="92" y="19" text-anchor="middle" fill="#ffffff" font-size="10.5" font-family="'Quicksand', sans-serif" font-weight="700">+ Buka Transaksi Baru</text>
