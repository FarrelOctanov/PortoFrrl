<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none" class="owalla-pos-thumbnail">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="ow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="60%" stop-color="#0d1728" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <!-- Ambient Radial Glow Behind Terminal -->
    <radialGradient id="ow-glow" cx="30%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="ow-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.04" />
      <circle cx="32" cy="32" r="0.75" fill="#38bdf8" fill-opacity="0.12" />
    </pattern>

    <!-- Surface Gradients -->
    <linearGradient id="terminal-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f192b" />
      <stop offset="100%" stop-color="#0c1322" />
    </linearGradient>
    <linearGradient id="card-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131e33" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="stock-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Neumorphic Drop Shadows -->
    <filter id="shadow-terminal" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="shadow-card" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Solid Outer Canvas (Prevents any transparency issues) -->
  <rect width="800" height="450" fill="url(#ow-bg)" />
  <rect width="800" height="450" fill="url(#ow-grid)" />
  <circle cx="260" cy="220" r="280" fill="url(#ow-glow)" />

  <!-- Top Framework & Architecture Badge -->
  <g transform="translate(540, 26)">
    <rect width="200" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <!-- Laravel Red Dot -->
    <circle cx="16" cy="14" r="4" fill="#f43f5e" />
    <text x="27" y="18" fill="#f8fafc" font-size="11" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="700">Laravel 10</text>
    <text x="96" y="18" fill="#64748b" font-size="11" font-family="system-ui, -apple-system, 'Quicksand', sans-serif">•</text>
    <text x="108" y="18" fill="#38bdf8" font-size="11" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="600">POS &amp; MySQL</text>
  </g>

  <!-- ========================================================= -->
  <!-- LEFT HERO: MODERN TOUCHSCREEN POS TERMINAL REGISTER       -->
  <!-- ========================================================= -->
  <g id="pos-terminal" filter="url(#shadow-terminal)">
    <!-- Terminal Outer Bezel -->
    <rect x="60" y="66" width="400" height="310" rx="16" fill="#0b1322" stroke="#1e293b" stroke-width="2" />

    <!-- Terminal Screen Display -->
    <rect x="74" y="80" width="372" height="282" rx="10" fill="url(#terminal-screen)" stroke="#1a273e" stroke-width="1.2" />

    <!-- Screen Header Bar -->
    <g transform="translate(92, 100)">
      <!-- Store / Brand Badge -->
      <rect width="90" height="22" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1" />
      <text x="12" y="15" fill="#38bdf8" font-size="11" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="800" letter-spacing="0.5">OWALLA.ID</text>

      <!-- Terminal ID & Status -->
      <text x="104" y="15" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="600">Kasir POS #01</text>
      <circle cx="320" cy="11" r="4" fill="#10b981" />
      <text x="306" y="15" fill="#10b981" font-size="10.5" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="700" text-anchor="end">Live</text>
    </g>

    <!-- Horizontal Divider -->
    <line x1="92" y1="134" x2="426" y2="134" stroke="#1e293b" stroke-width="1" />

    <!-- Active Transaction Total Section -->
    <g transform="translate(92, 150)">
      <text x="0" y="14" fill="#64748b" font-size="11" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="700" letter-spacing="1">TOTAL TRANSAKSI</text>
      <!-- Big Readable Price Display -->
      <text x="0" y="48" fill="#f8fafc" font-size="34" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="800" letter-spacing="-0.5">Rp 350.000</text>

      <!-- Payment Status Pill (QRIS Success) -->
      <g transform="translate(0, 64)">
        <rect width="186" height="26" rx="13" fill="#10b981" fill-opacity="0.16" stroke="#10b981" stroke-width="1" />
        <!-- Checkmark Icon -->
        <circle cx="14" cy="13" r="7" fill="#10b981" />
        <path d="M11 13 l2 2 l4 -4" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <text x="28" y="17" fill="#34d399" font-size="11" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="700">QRIS • Pembayaran Sukses</text>
      </g>
    </g>

    <!-- Order Item Preview Card Inside Screen -->
    <g transform="translate(92, 260)">
      <rect width="336" height="54" rx="8" fill="#0f1a2c" stroke="#1c2d47" stroke-width="1" />
      <!-- Item Icon (Shopping Bag / Package) -->
      <rect x="12" y="12" width="30" height="30" rx="6" fill="#0284c7" fill-opacity="0.22" />
      <path d="M22 22 h10 v12 h-10 z M25 22 v-3 a2 2 0 0 1 4 0 v3" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Item Details -->
      <text x="52" y="26" fill="#f8fafc" font-size="12" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="700">Kain Bordir Premium Custom</text>
      <text x="52" y="42" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, 'Quicksand', sans-serif">10 unit × Rp 35.000</text>
      <!-- Item Subtotal -->
      <text x="322" y="34" fill="#38bdf8" font-size="12" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="700" text-anchor="end">Rp 350.000</text>
    </g>

    <!-- Terminal Stand Base Below Bezel -->
    <path d="M220 376 L210 400 L290 400 L280 376 Z" fill="#0c1220" stroke="#1e293b" stroke-width="1.5" />
    <rect x="180" y="398" width="140" height="8" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT TOP CARD: DIGITAL RECEIPT / STRUK TRANSAKSI         -->
  <!-- ========================================================= -->
  <g id="card-receipt" transform="translate(490, 72)" filter="url(#shadow-card)">
    <rect width="250" height="152" rx="12" fill="url(#card-surface)" stroke="#1e2e4a" stroke-width="1.4" />

    <!-- Receipt Header -->
    <g transform="translate(18, 20)">
      <!-- Receipt Vector Icon -->
      <rect width="28" height="28" rx="6" fill="#0284c7" fill-opacity="0.2" />
      <path d="M9 7 h10 M9 12 h10 M9 17 h6" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" />
      <text x="38" y="14" fill="#f8fafc" font-size="13" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="700">Struk Transaksi</text>
      <text x="38" y="27" fill="#64748b" font-size="10" font-family="system-ui, -apple-system, 'Quicksand', sans-serif">#TRX-2025-084</text>
    </g>

    <!-- Dashed Tear Line -->
    <line x1="18" y1="62" x2="232" y2="62" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4 3" />

    <!-- Receipt Meta Fields -->
    <g transform="translate(18, 76)">
      <text x="0" y="14" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, 'Quicksand', sans-serif">Waktu</text>
      <text x="214" y="14" fill="#f8fafc" font-size="11" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="600" text-anchor="end">14:32 WIB</text>

      <text x="0" y="34" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, 'Quicksand', sans-serif">Metode Bayar</text>
      <text x="214" y="34" fill="#38bdf8" font-size="11" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="700" text-anchor="end">QRIS Dinamis</text>

      <text x="0" y="54" fill="#94a3b8" font-size="11" font-family="system-ui, -apple-system, 'Quicksand', sans-serif">Status</text>
      <text x="214" y="54" fill="#34d399" font-size="11" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="800" text-anchor="end">LUNAS ✓</text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT BOTTOM CARD: MANAJEMEN STOK & SKU INVENTARIS        -->
  <!-- ========================================================= -->
  <g id="card-stock" transform="translate(490, 244)" filter="url(#shadow-card)">
    <rect width="250" height="152" rx="12" fill="url(#card-surface)" stroke="#1e2e4a" stroke-width="1.4" />

    <!-- Stock Header -->
    <g transform="translate(18, 20)">
      <!-- Package / Inventory Box Icon -->
      <rect width="28" height="28" rx="6" fill="#38bdf8" fill-opacity="0.18" />
      <path d="M7 11 L14 7 L21 11 L14 15 Z M7 11 V19 L14 23 V15 M21 11 V19 L14 23" stroke="#38bdf8" stroke-width="1.4" stroke-linejoin="round" fill="none" />
      <text x="38" y="14" fill="#f8fafc" font-size="13" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="700">Manajemen Stok</text>
      <text x="38" y="27" fill="#38bdf8" font-size="10" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="600">SKU-BD-012</text>
    </g>

    <!-- Stock Counter & Badge -->
    <g transform="translate(18, 66)">
      <text x="0" y="18" fill="#f8fafc" font-size="22" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="800">142</text>
      <text x="44" y="18" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, 'Quicksand', sans-serif">meter kain</text>

      <!-- Status Pill -->
      <g transform="translate(138, 2)">
        <rect width="76" height="20" rx="10" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1" />
        <circle cx="10" cy="10" r="3" fill="#10b981" />
        <text x="18" y="14" fill="#34d399" font-size="10" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="700">Stok Aman</text>
      </g>
    </g>

    <!-- Inventory Level Progress Bar -->
    <g transform="translate(18, 102)">
      <rect width="214" height="7" rx="3.5" fill="#0b1322" stroke="#1c2d47" stroke-width="0.8" />
      <rect width="168" height="7" rx="3.5" fill="url(#stock-bar)" />
      <text x="0" y="24" fill="#64748b" font-size="10" font-family="system-ui, -apple-system, 'Quicksand', sans-serif">Kapasitas Gudang</text>
      <text x="214" y="24" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, 'Quicksand', sans-serif" font-weight="700" text-anchor="end">78% Terisi</text>
    </g>
  </g>
</svg>
