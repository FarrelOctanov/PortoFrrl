<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none" class="owalla-pos-svg">
  <defs>
    <!-- Background Gradient for Main Frame -->
    <linearGradient id="dashboard-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162032" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="stat-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Solid Outer Canvas (Prevents any transparency / dark-mode inversion bugs) -->
  <rect width="800" height="450" fill="url(#dashboard-bg)" />

  <!-- Top Window Header Bar -->
  <g id="topbar">
    <rect x="0" y="0" width="800" height="44" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <!-- Window Controls -->
    <circle cx="22" cy="22" r="5" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="38" cy="22" r="5" fill="#f59e0b" fill-opacity="0.8" />
    <circle cx="54" cy="22" r="5" fill="#10b981" fill-opacity="0.8" />

    <!-- Application Brand & Breadcrumb -->
    <text x="80" y="26" fill="#f8fafc" font-size="12" font-family="'Quicksand', sans-serif" font-weight="700" letter-spacing="0.5">OWALLA.ID</text>
    <text x="156" y="26" fill="#64748b" font-size="11" font-family="'Quicksand', sans-serif">/</text>
    <text x="170" y="26" fill="#38bdf8" font-size="11" font-family="'Quicksand', sans-serif" font-weight="600">Sistem Kasir &amp; Manajemen Stok Barang</text>

    <!-- Laravel Engine & Status Badge -->
    <g transform="translate(630, 12)">
      <rect width="146" height="20" rx="4" fill="#162032" stroke="#1e293b" stroke-width="1" />
      <circle cx="10" cy="10" r="3.5" fill="#10b981" />
      <text x="20" y="14" fill="#94a3b8" font-size="9.5" font-family="'Quicksand', sans-serif" font-weight="600">Laravel 10 • Server Aktif</text>
    </g>
  </g>

  <!-- Left Sidebar Navigation -->
  <g id="sidebar" transform="translate(0, 44)">
    <rect width="180" height="406" fill="#0c1322" stroke="#1e293b" stroke-width="1" />

    <!-- Navigation Menu Items -->
    <!-- 1. Dashboard (Active) -->
    <g transform="translate(12, 20)">
      <rect width="156" height="32" rx="6" fill="#0284c7" fill-opacity="0.18" stroke="#0284c7" stroke-width="1" />
      <!-- Dashboard Icon -->
      <path d="M12 11h3v3h-3z M17 11h3v3h-3z M12 16h3v3h-3z M17 16h3v3h-3z" fill="#38bdf8" />
      <text x="28" y="20" fill="#38bdf8" font-size="11" font-family="'Quicksand', sans-serif" font-weight="700">Dashboard Utama</text>
    </g>

    <!-- 2. Kasir POS -->
    <g transform="translate(12, 60)">
      <rect width="156" height="28" rx="6" fill="transparent" />
      <circle cx="15" cy="14" r="4" stroke="#94a3b8" stroke-width="1.2" fill="none" />
      <text x="28" y="18" fill="#94a3b8" font-size="11" font-family="'Quicksand', sans-serif" font-weight="600">Kasir / Point of Sale</text>
    </g>

    <!-- 3. Stok Barang -->
    <g transform="translate(12, 94)">
      <rect width="156" height="28" rx="6" fill="transparent" />
      <rect x="12" y="8" width="8" height="8" rx="1.5" stroke="#94a3b8" stroke-width="1.2" fill="none" />
      <text x="28" y="18" fill="#94a3b8" font-size="11" font-family="'Quicksand', sans-serif" font-weight="600">Stok Barang &amp; SKU</text>
    </g>

    <!-- 4. Riwayat Transaksi -->
    <g transform="translate(12, 128)">
      <rect width="156" height="28" rx="6" fill="transparent" />
      <path d="M12 10h8 M12 14h6 M12 18h4" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
      <text x="28" y="18" fill="#94a3b8" font-size="11" font-family="'Quicksand', sans-serif" font-weight="600">Riwayat Transaksi</text>
    </g>

    <!-- 5. Laporan & Invoice -->
    <g transform="translate(12, 162)">
      <rect width="156" height="28" rx="6" fill="transparent" />
      <path d="M13 18l3-4 2 2 3-5" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="28" y="18" fill="#94a3b8" font-size="11" font-family="'Quicksand', sans-serif" font-weight="600">Laporan Penjualan</text>
    </g>

    <!-- Sidebar Bottom User Card -->
    <g transform="translate(12, 340)">
      <rect width="156" height="48" rx="8" fill="#131c2d" stroke="#1e293b" stroke-width="1" />
      <circle cx="24" cy="24" r="12" fill="#0284c7" />
      <text x="24" y="28" text-anchor="middle" fill="#ffffff" font-size="10" font-family="'Quicksand', sans-serif" font-weight="700">FO</text>
      <text x="44" y="21" fill="#f8fafc" font-size="10.5" font-family="'Quicksand', sans-serif" font-weight="700">Farrel Octanov</text>
      <text x="44" y="33" fill="#64748b" font-size="8.5" font-family="'Quicksand', sans-serif">Admin Sistem</text>
    </g>
